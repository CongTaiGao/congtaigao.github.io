<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img">
<title>Cloud Account Takeover</title>
<desc>Identity, Workspace, endpoint, and network events form one timeline.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<circle cx="1122" cy="70" r="86" fill="#dceaff" opacity=".62"/>
<circle cx="1090" cy="42" r="36" fill="#c8e0ff" opacity=".62"/>
<text x="58" y="45" fill="#3579d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">SECURITY WRITE-UP</text>
<text x="58" y="88" fill="#15233b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">Cloud Account Takeover</text>
<text x="58" y="119" fill="#586a84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Identity, Workspace, endpoint, and network events form one timeline.</text>
<rect x="66" y="154" width="246" height="152" rx="18" fill="#ffffff" stroke="#d5e2f3" stroke-width="2"/>
<circle cx="97" cy="185" r="15" fill="#347fe3"/>
<text x="97" y="190" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">1</text>
<text x="86" y="222" fill="#192b46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Phishing + MFA</text>
<text x="86" y="248" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">An account change follows</text>
<text x="86" y="269" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">sign-in</text>
<path d="M 316 230 H 331" stroke="#78a9ec" stroke-width="3" stroke-linecap="round"/><path d="M 325 224 L 331 230 L 325 236" fill="none" stroke="#78a9ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="340" y="154" width="246" height="152" rx="18" fill="#ffffff" stroke="#d5e2f3" stroke-width="2"/>
<circle cx="371" cy="185" r="15" fill="#347fe3"/>
<text x="371" y="190" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">2</text>
<text x="360" y="222" fill="#192b46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">OAuth abuse</text>
<text x="360" y="248" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">An app interferes with alerts</text>
<path d="M 590 230 H 605" stroke="#78a9ec" stroke-width="3" stroke-linecap="round"/><path d="M 599 224 L 605 230 L 599 236" fill="none" stroke="#78a9ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="614" y="154" width="246" height="152" rx="18" fill="#ffffff" stroke="#d5e2f3" stroke-width="2"/>
<circle cx="645" cy="185" r="15" fill="#347fe3"/>
<text x="645" y="190" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">3</text>
<text x="634" y="222" fill="#192b46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Drive to database</text>
<text x="634" y="248" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Document access precedes</text>
<text x="634" y="269" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">export</text>
<path d="M 864 230 H 879" stroke="#78a9ec" stroke-width="3" stroke-linecap="round"/><path d="M 873 224 L 879 230 L 873 236" fill="none" stroke="#78a9ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="888" y="154" width="246" height="152" rx="18" fill="#ffffff" stroke="#d5e2f3" stroke-width="2"/>
<circle cx="919" cy="185" r="15" fill="#347fe3"/>
<text x="919" y="190" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">4</text>
<text x="908" y="222" fill="#192b46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Outbound transfer</text>
<text x="908" y="248" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">A staged archive leaves the</text>
<text x="908" y="269" fill="#5a6b84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">network</text>
<rect x="58" y="335" width="1084" height="1" fill="#d4e1f2"/>
<text x="58" y="362" fill="#6a7c95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing=".5">CORRELATE EVENTS  &#8226;  VERIFY THE SOURCE  &#8226;  MINIMIZE EXPOSED DATA</text>
</svg>
